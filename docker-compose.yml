services:
  radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar-innowacji
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RADAR_OPEN_BROWSER: "false"
      RADAR_SINGLE_INSTANCE: "false"
      RADAR_SCANNING_ENABLED: "true"
      RADAR_CONTINUOUS_SCANNING: "true"
      RADAR_CONTINUOUS_DELAY_SECONDS: "30"
      RADAR_SCAN_INTERVAL_MINUTES: "15"
      RADAR_SCAN_MAX_ITEMS: "50"
      RADAR_AI_ENABLED: "true"
      RADAR_AI_URL: "http://ollama:11434"
      RADAR_AI_MODEL: "${RADAR_AI_MODEL:-SpeakLeash/bielik-1.5b-v3.0-instruct:Q8_0}"
      RADAR_CATEGORY_EMBEDDING_PROVIDER: "Lokalny"
    volumes:
      - radar-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: radar-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Jednorazowe pobranie modelu AI przy starcie stacku.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: radar-ollama-pull
    environment:
      OLLAMA_HOST: http://ollama:11434
      RADAR_AI_MODEL: "${RADAR_AI_MODEL:-SpeakLeash/bielik-1.5b-v3.0-instruct:Q8_0}"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "ollama pull ${RADAR_AI_MODEL:-SpeakLeash/bielik-1.5b-v3.0-instruct:Q8_0}"
    restart: "no"

volumes:
  radar-data:
  ollama-data:
